[workspace]
resolver = "3"
members = [
    "michiu",
    "michiu_ui",
    "michiu_guard",
    "michiu_window",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eto0202/michiu"
readme = "README.md"

[workspace.dependencies]
michiu = { version = "0.0.1", path = "michiu" }
michiu_ui = { version = "0.0.1", path = "michiu_ui" }
michiu_guard = { version = "0.0.1", path = "michiu_guard" }
michiu_window = { version = "0.0.1", path = "michiu_window" }
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
debug = 2
strip = "none"
split-debuginfo = "packed"
