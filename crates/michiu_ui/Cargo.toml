[package]
name = "michiu_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The michiu library handles layout."
readme = "README.md"

[lints]
workspace = true

[dependencies]
accesskit = "=0.25.2"
accesskit_windows = "0.35.2"
bytemuck = { version = "1.25.0", features = ["derive"] }
serde = { workspace = true, optional = true }
slotmap = "1.1.1"
smallvec = "1.16.5"
taffy = "0.15.1"
wgpu = { version = "30.0.2", default-features = false, features = ["dx12", "wgsl"] }
notify = "8.2.2"
windows-core = "0.62.2"
rustc-hash = "2.1.3"
cosmic-text = "0.19.0"
bytecount = "0.6.9"
thiserror = "2.0.20"
derive_more = { version = "2.1.1", features = ["debug", "deref", "deref_mut", "into_iterator"] }
parking_lot = "0.13.0"
dhat = { version = "0.3.3", optional = true }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "System",
    "UI_Composition_Desktop",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Imaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Input_Ime",
    "Win32_Graphics_DirectComposition",
]

[features]
serde = ["dep:serde"]
dhat-heap = ["dep:dhat"]
default = ["trace-error"]
trace-error = []
trace-lifecycle = ["trace-error"]
trace-entity = ["trace-lifecycle"]
snapshot = ["trace-error"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
