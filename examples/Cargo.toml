[package]
name = "sample_collection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "sample_collection"
path = "sample_collection/main.rs"

[dependencies]
michiu = { workspace = true }
pollster = "1.0.1"
tiff-reader = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
image = "0.25.10"
smallvec = "1.16.5"
wgpu = { version = "30.0.2", default-features = false, features = ["dx12", "wgsl"] }
dhat = { version = "0.3.3", optional = true }
resvg = "0.50.0"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["bundler"] }
derive_more = { version = "2.1.1", features = ["debug", "deref", "deref_mut", "into_iterator"] }
webview2-com = "0.39.1"
windows-core = "0.62.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[features]
dhat-heap = ["dep:dhat"]
trace-lifecycle = ["michiu/trace-lifecycle"]

[lints]
