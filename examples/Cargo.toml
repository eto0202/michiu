[package]
name = "sample_collection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "sample_collection"
path = "sample_collection/main.rs"

[dependencies]
michiu = { workspace = true }
pollster = "1.0.1"
tiff-reader = "0.9.0"
strum = {version = "0.28.0", features = ["derive"] }
image = "0.25.10"
smallvec = "1.15.2"
wgpu = {version= "30.0.1", default-features = false, features = ["dx12", "wgsl"]}
dhat = { version = "0.3.3", optional = true }
resvg = "0.49.0"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["bundler"] }
derive_more = { version = "2.1.1", features = ["std", "debug", "deref", "deref_mut", "into_iterator"] }
webview2-com = "0.39.1"
windows-core = "0.62.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Imaging",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_System_WinRT_Direct3D11",
    "Graphics_Capture",
    "UI_Composition",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Input_Ime",
    "Win32_System_DataExchange",
    "Win32_Graphics_Dwm",
    "Win32_System_WinRT",
    "System",
    "Win32_System_WinRT_Composition",
    "UI_Composition_Desktop",
]

[features]
dhat-heap = ["dep:dhat"]
trace-lifecycle = ["michiu/trace-lifecycle"]

[lints]
