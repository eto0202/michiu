changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot[bot]
  categories:
    - title: "💥 Breaking Changes"
      labels:
        - "breaking-change"
        - "breaking"
    - title: "🚀 New Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "📚 Documentation"
      labels:
        - "documentation"
        - "docs"
    - title: "🛠 Maintenance"
      labels:
        - "maintenance"
        - "refactor"
        - "ci"
